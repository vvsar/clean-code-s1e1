<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>
  <body>
    <header class="header">
      <img
        class="header__img"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      />
      <a
        class="header__more-info-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section>
        <label for="new-task-name-input" class="section-title">Add Item</label>
        <div class="add-task-form">
          <input
            id="new-task-name-input"
            class="add-task-form__name"
            type="text"
          />
          <button class="add-task-form__add-button">Add</button>
        </div>
      </section>
      <section>
        <h3 class="section-title">Todo</h3>
        <ul id="incomplete-tasks">
          <li class="task-form">
            <input class="task-form__checkbox" type="checkbox" />
            <label class="task-form__name">Pay Bills</label>
            <input type="text" class="task-form__name" />
            <button class="task-form__edit-button">Edit</button>
            <button class="task-form__delete-button">
              <img
                class="task-form__delete-button-img"
                src="./remove.svg"
                alt="delete button"
              />
            </button>
          </li>
          <li class="task-form task-form_edit-mode">
            <input class="task-form__checkbox" type="checkbox" />
            <label class="task-form__name">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-form__name" />
            <button class="task-form__edit-button">Save</button>
            <button class="task-form__delete-button">
              <img
                class="task-form__delete-button-img"
                src="./remove.svg"
                alt="delete button"
              />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3 class="section-title">Completed</h3>
        <ul id="completed-tasks">
          <li class="task-form">
            <input class="task-form__checkbox" type="checkbox" checked />
            <label class="task-form__name">See the Doctor</label>
            <input type="text" class="task-form__name" />
            <button class="task-form__edit-button">Edit</button>
            <button class="task-form__delete-button">
              <img
                class="task-form__delete-button-img"
                src="./remove.svg"
                alt="delete button"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
